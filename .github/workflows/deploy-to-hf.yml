name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # pubspec.lock requires dart >=3.10.0 / flutter >=3.38.0 (google_fonts
          # ^8.2.1). Anything older fails at "flutter pub get" with a version
          # solving error, so keep this at or above 3.38.
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # The Flask app serves the compiled web app from app/final_design/static
      # (static_folder="static" in app.py). That directory is gitignored build
      # output, so it has to be rebuilt here - a checkout never contains it.
      # Must run before the platform directories are deleted below: the build
      # needs app/final_design/web.
      - name: Build Flutter web frontend
        working-directory: app/final_design
        run: |
          flutter pub get
          flutter build web --release --output static

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Set git identity for the orphan commit
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # Remove files not needed for deployment
          rm -rf data/ test_results/ sample_model_data/ notebooks/ *.png
          # Remove Flutter build intermediates (keep static/, which is the output)
          rm -rf app/final_design/build app/final_design/.dart_tool
          # Remove Flutter platform directories (only need Flask backend)
          rm -rf app/final_design/macos app/final_design/ios app/final_design/android app/final_design/windows app/final_design/linux app/final_design/web app/final_design/test
          # Use HF-specific README with Space configuration
          cp README_HF.md README.md
          # Create a fresh commit without history
          git checkout --orphan hf-deploy
          # The Hub rejects raw binaries ("Your push was rejected because it
          # contains binary files"). Flutter emits six CanvasKit .wasm blobs, so
          # they have to go through LFS/Xet. Track them BEFORE staging, or the
          # clean filter never runs and the push is rejected again.
          git lfs install --local
          echo '*.wasm filter=lfs diff=lfs merge=lfs -text' >> .gitattributes
          git add -A
          # static/ is gitignored build output, but the backend serves it - force it in.
          # Targeted rather than "add -A -f", which would sweep in every ignored file.
          git add -f app/final_design/static
          git commit -m "Deploy to Hugging Face Spaces"
          git remote add hf https://huggingface.co/spaces/anishanup/pelta || true
          git remote set-url hf https://user:$HF_TOKEN@huggingface.co/spaces/anishanup/pelta
          git push hf hf-deploy:main --force
